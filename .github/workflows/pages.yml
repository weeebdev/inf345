name: "Pages: Build & Deploy Lectures"

# Builds every Slidev lecture deck under lectures/*/slides.md and publishes
# them all to GitHub Pages at https://weeebdev.github.io/inf345/.
#
# Lecture decks are discovered dynamically by scripts/build-pages.sh, so
# adding a new lectures/NN-slug/slides.md requires no changes here.

on:
  push:
    branches: [main]
    paths:
      - "lectures/**"
      - "pdfs/**"
      - "scripts/build-pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # npm ci is preferred (reproducible), but it hard-fails whenever the
      # lockfile was written by a different npm major than the runner's.
      # The deck build doesn't warrant breaking publishing over that, so
      # fall back to npm install and carry on.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || {
              echo "::warning::npm ci failed (lockfile/npm mismatch) — falling back to npm install"
              npm install
            }
          else
            npm install
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build all lecture decks
        run: bash scripts/build-pages.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
